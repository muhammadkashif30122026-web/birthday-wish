<!DOCTYPE html>
<html>
<head>
<title>Happy Birthday!</title>
<style>
body { background: #ffafbd; background: linear-gradient(to right, #ffc3a0, #ffafbd); text-align: center; font-family: 'Arial'; padding-top: 100px; }
h1 { color: white; font-size: 60px; animation: bounce 2s infinite; }
p { color: #333; font-size: 22px; }
button { padding: 15px 30px; font-size: 20px; border: none; border-radius: 30px; background: white; color: #ff6a88; cursor: pointer; }
@keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-30px);} 60% {transform: translateY(-15px);} }
</style>
</head>
<body>
<h1>🎂 Happy Birthday! 🎉</h1>
<p>Wishing you a day filled with love, happiness and cake!</p>
<button onclick="alert('Many Many Happy Returns of the Day! 🎁')">Click Me ❤️</button>
</body>
</html>
